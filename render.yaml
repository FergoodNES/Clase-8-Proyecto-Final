services:
  - type: web
    name: incidenthub-platform-secure
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && node scripts/prepare-prisma.js && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: incidenthub-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: incidenthub-postgres
    plan: free
    region: oregon
    databaseName: incidenthub_db
    user: incidenthub_user
